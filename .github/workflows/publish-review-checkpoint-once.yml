name: Publish AzWA review checkpoint release
on:
  push:
    paths:
      - '.github/workflows/publish-review-checkpoint-once.yml'
permissions:
  contents: write
jobs:
  publish-review-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: checkpoint/v1.0.0-review-freeze-20261107
          fetch-depth: 0
      - name: Verify immutable checkpoint and review report
        run: |
          test "$(git rev-parse HEAD)" = "70210cb5dcc0de6207c5db7d497634bb4996638e"
          test -s docs/PROJECT_REVIEW_FREEZE_2026-11-07.md
      - name: Create review release from exact checkpoint commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v1.0.0-review-freeze.20261107"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $tag"
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "70210cb5dcc0de6207c5db7d497634bb4996638e" \
            --title "AzWA v1.0.0 — Review Freeze 2026-11-07" \
            --notes-file docs/PROJECT_REVIEW_FREEZE_2026-11-07.md \
            --prerelease
