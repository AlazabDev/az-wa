name: Sync Bun lock after framework cleanup
on:
  push:
    paths:
      - '.github/workflows/sync-framework-lock-once.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Synchronize deterministic lockfile
        run: |
          bun install --lockfile-only
          bun install --frozen-lockfile
      - name: Commit reproducible lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- bun.lock; then
            git add bun.lock
            git commit -m 'chore(deps): sync Bun lock after dropping Next.js-only dependency'
            git push origin HEAD:develop
          fi
