name: Persist webhook admin module

on:
  push:
    branches:
      - fix/az-wa-clean-20260926

permissions:
  contents: write

jobs:
  persist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/az-wa-clean-20260926
          fetch-depth: 0
      - name: Restore and force-track required module
        run: |
          git show origin/fix/lint-warnings-cleanup-20260926:src/lib/meta/webhook-admin.functions.ts > src/lib/meta/webhook-admin.functions.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/lib/meta/webhook-admin.functions.ts
          git commit -m "fix: track webhook admin server module"
          git push origin HEAD:fix/az-wa-clean-20260926
