name: Autofix lint and formatting

on:
  push:
    branches:
      - fix/lint-warnings-cleanup-20260926

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/lint-warnings-cleanup-20260926
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repository
        run: npm run format

      - name: Apply ESLint autofixes
        run: npm run lint -- --fix
        continue-on-error: true

      - name: Commit autofixes
        run: |
          if git diff --quiet; then
            echo "No autofix changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply prettier and eslint autofixes"
          git push origin HEAD:fix/lint-warnings-cleanup-20260926
