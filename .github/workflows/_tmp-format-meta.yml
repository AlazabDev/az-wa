name: Temporary Meta formatter

on:
  push:
    branches:
      - cleanup/remove-drizzle-lovable-env

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/remove-drizzle-lovable-env
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format Meta functions
        run: bunx prettier --write src/lib/meta/meta.functions.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- src/lib/meta/meta.functions.ts; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/meta/meta.functions.ts
          git commit -m "Format Meta server functions"
          git push origin HEAD:cleanup/remove-drizzle-lovable-env
