name: Branch production lint autofix

on:
  push:
    branches:
      - fix/production-auth-deploy-20260902

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-auth-deploy-20260902

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply targeted ESLint fixes
        shell: bash
        run: |
          bunx eslint --fix \
            src/integrations/supabase/previewAuthStorage.ts \
            src/integrations/supabase/types.ts \
            src/lib/meta/app-webhook.server.ts \
            src/lib/meta/meta.functions.ts \
            src/lib/meta/public-config.ts \
            src/pages/Finance.tsx \
            src/routes/_authenticated/route.tsx \
            src/routes/_authenticated/webhooks.tsx \
            src/routes/auth.tsx \
            supabase/functions/finance-ingest/index.ts \
            src/components/ProtectedRoute.tsx \
            src/contexts/AuthContext.tsx || true

      - name: Commit autofixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No autofix changes"
            exit 0
          fi
          git config user.name "Alazab Production CI"
          git config user.email "mohamed@alazab.com"
          git add \
            src/integrations/supabase/previewAuthStorage.ts \
            src/integrations/supabase/types.ts \
            src/lib/meta/app-webhook.server.ts \
            src/lib/meta/meta.functions.ts \
            src/lib/meta/public-config.ts \
            src/pages/Finance.tsx \
            src/routes/_authenticated/route.tsx \
            src/routes/_authenticated/webhooks.tsx \
            src/routes/auth.tsx \
            supabase/functions/finance-ingest/index.ts \
            src/components/ProtectedRoute.tsx \
            src/contexts/AuthContext.tsx
          git commit -m "style: apply production lint autofixes"
          git push origin HEAD:fix/production-auth-deploy-20260902
