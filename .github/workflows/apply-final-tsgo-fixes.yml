name: apply final tsgo fixes

on:
  push:
    branches:
      - fix/final-tsgo-build

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[tsgo-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-tsgo-build
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply surgical repairs
        run: python scripts/fix-final-tsgo.py

      - name: Verify patch shape
        run: git diff --check

      - name: Commit repaired files
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "AzWA Build Repair"
          git config user.email "actions@users.noreply.github.com"
          git add src tsconfig.json
          git commit -m "fix: resolve final tsgo build errors [tsgo-fixed]"
          git push origin HEAD:fix/final-tsgo-build
