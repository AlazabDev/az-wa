name: Regenerate pinned Bun lockfile (one shot)
on:
  push:
    paths:
      - '.github/workflows/repair-bun-lockfile-once.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Generate exact Bun lockfile
        run: bun install --lockfile-only
      - name: Verify frozen install
        run: bun install --frozen-lockfile
      - name: Commit refreshed lock
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bun.lock
            git commit -m 'fix(ci): sync Bun lockfile with current dependency graph'
            git push origin HEAD:develop
          fi
