name: Repair Bun 1.3.3 lockfile
on:
  push:
    paths:
      - '.github/workflows/repair-bun-lockfile-once.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Regenerate lock using pinned Bun
        run: |
          rm -f bun.lock
          bun install --lockfile-only
          bun install --frozen-lockfile
      - name: Save reproducible lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m 'fix(deps): regenerate Bun 1.3.3 compatible lockfile'
            git push origin HEAD:develop
          fi
