name: Format Meta template changes once

on:
  push:
    branches:
      - fix/meta-template-runtime-builder

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meta-template-runtime-builder
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed Meta template files
        run: >-
          npx prettier --write
          src/lib/azwa-templates.ts
          src/lib/meta/template-schema.ts
          src/lib/meta/templates.functions.ts
          src/components/azwa/create-template-dialog.tsx
          src/routes/_authenticated/templates.tsx
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/azwa-templates.ts src/lib/meta/template-schema.ts src/lib/meta/templates.functions.ts src/components/azwa/create-template-dialog.tsx src/routes/_authenticated/templates.tsx
          git commit -m "style: format Meta template changes"
          git push origin HEAD:fix/meta-template-runtime-builder
