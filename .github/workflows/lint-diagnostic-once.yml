name: Capture ESLint diagnostics once

on:
  push:
    branches:
      - fix/meta-template-runtime-builder

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meta-template-runtime-builder
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Production build and route generation
        env:
          VITE_SUPABASE_URL: https://pmhuylckjwrongxlrgrx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
          VITE_SUPABASE_PROJECT_ID: pmhuylckjwrongxlrgrx
          VITE_ENABLE_LEGACY_UI: "false"
          SUPABASE_URL: https://pmhuylckjwrongxlrgrx.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
          META_WEBHOOK_PUBLIC_URL: https://wa.alazab.com/api/public/webhooks/meta/whatsapp
          LOVABLE_CRON_SECRET: ci-cron-placeholder
        run: bun run build
      - run: bun run typecheck
      - name: Capture ESLint JSON after build
        shell: bash
        run: |
          set +e
          bunx eslint . -f json > /tmp/eslint-full.json
          set -e
          node <<'NODE'
          const fs = require('fs');
          const all = JSON.parse(fs.readFileSync('/tmp/eslint-full.json', 'utf8'));
          const concise = all
            .filter((entry) => entry.errorCount || entry.warningCount)
            .map((entry) => ({
              filePath: entry.filePath.replace(process.cwd() + '/', ''),
              errorCount: entry.errorCount,
              warningCount: entry.warningCount,
              messages: entry.messages.map((m) => ({
                ruleId: m.ruleId,
                severity: m.severity,
                message: m.message,
                line: m.line,
                column: m.column,
                endLine: m.endLine,
                endColumn: m.endColumn,
              })),
            }));
          fs.writeFileSync('lint-report.json', JSON.stringify(concise, null, 2) + '\n');
          NODE
      - name: Commit diagnostics
        shell: bash
        run: |
          if git diff --quiet -- lint-report.json; then
            echo "Diagnostic report unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lint-report.json
          git commit -m "ci: capture post-build ESLint diagnostics"
          git push origin HEAD:fix/meta-template-runtime-builder
