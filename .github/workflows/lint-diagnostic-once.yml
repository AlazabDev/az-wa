name: Verify Meta template changes once

on:
  push:
    branches:
      - fix/meta-template-runtime-builder

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meta-template-runtime-builder
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format changed Meta template files
        run: >-
          bunx prettier --write
          src/lib/azwa-templates.ts
          src/lib/meta/template-schema.ts
          src/lib/meta/templates.functions.ts
          src/components/azwa/create-template-dialog.tsx
          src/routes/_authenticated/templates.tsx
      - name: Commit formatting if required
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/azwa-templates.ts src/lib/meta/template-schema.ts src/lib/meta/templates.functions.ts src/components/azwa/create-template-dialog.tsx src/routes/_authenticated/templates.tsx
            git commit -m "style: format final Meta template changes"
            git push origin HEAD:fix/meta-template-runtime-builder
          fi
      - name: Production build and route generation
        env:
          VITE_SUPABASE_URL: https://pmhuylckjwrongxlrgrx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
          VITE_SUPABASE_PROJECT_ID: pmhuylckjwrongxlrgrx
          VITE_ENABLE_LEGACY_UI: "false"
          SUPABASE_URL: https://pmhuylckjwrongxlrgrx.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
          META_WEBHOOK_PUBLIC_URL: https://wa.alazab.com/api/public/webhooks/meta/whatsapp
          LOVABLE_CRON_SECRET: ci-cron-placeholder
        run: bun run build
      - run: bun run typecheck
      - name: Lint changed Meta template files
        run: >-
          bunx eslint
          src/lib/azwa-templates.ts
          src/lib/meta/template-schema.ts
          src/lib/meta/templates.functions.ts
          src/components/azwa/create-template-dialog.tsx
          src/routes/_authenticated/templates.tsx
