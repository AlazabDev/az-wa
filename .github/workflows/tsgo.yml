name: tsgo verification

on:
  push:
    branches:
      - fix/final-tsgo-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tsgo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript native check
        run: npx -y @typescript/native-preview --noEmit -p tsconfig.json
