name: Development CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_PROJECT_ID: ci-project
      VITE_SUPABASE_URL: https://ci-project.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      SUPABASE_PROJECT_ID: ci-project
      SUPABASE_URL: https://ci-project.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint > lint.log 2>&1

      - name: Build
        id: build
        continue-on-error: true
        run: bun run build > build.log 2>&1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-ci-diagnostics
          path: |
            lint.log
            build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Validation gate
        if: steps.lint.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          echo '=== LINT ==='
          cat lint.log || true
          echo '=== BUILD ==='
          cat build.log || true
          exit 1
