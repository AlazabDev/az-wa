name: Development CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_PROJECT_ID: ci-project
      VITE_SUPABASE_URL: https://ci-project.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      SUPABASE_PROJECT_ID: ci-project
      SUPABASE_URL: https://ci-project.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
