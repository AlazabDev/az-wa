name: Webhook monitor build

on:
  push:
    branches:
      - feat/webhook-monitor-screen-20260926

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webhook-monitor-screen-20260926
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integrate interactive monitor and refresh deploy lock guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          page = Path('src/routes/_authenticated/webhooks.tsx')
          text = page.read_text()
          text = text.replace(
              'import { StatusBadge } from "@/components/azwa/status-badge";\nimport { RecordTable } from "@/components/azwa/record-table";',
              'import { StatusBadge } from "@/components/azwa/status-badge";\nimport { WebhookTrafficMonitor } from "@/components/azwa/webhook-traffic-monitor";',
          )
          text = text.replace('  Search,\n', '')
          text = text.replace('  const [eventTypeFilter, setEventTypeFilter] = useState("");\n', '')
          text = text.replace('  const [statusFilter, setStatusFilter] = useState("");\n', '')

          pattern = re.compile(
              r'\n      \{/\* Webhook event audit log \*/\}.*?\n      \{/\* Dialogs \*/\}',
              re.S,
          )
          replacement = '\n      {/* Live webhook monitoring */}\n      <WebhookTrafficMonitor />\n\n      {/* Dialogs */}'
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Unable to locate webhook audit block')
          page.write_text(text)

          deploy = Path('deploy/deploy.sh')
          deploy_text = deploy.read_text()
          lock_blob = subprocess.check_output(['git', 'hash-object', 'package-lock.json'], text=True).strip()
          deploy_text, count = re.subn(
              r'EXPECTED_LOCK_BLOB="[0-9a-f]+"',
              f'EXPECTED_LOCK_BLOB="{lock_blob}"',
              deploy_text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Unable to update EXPECTED_LOCK_BLOB')
          deploy.write_text(deploy_text)
          PY

      - name: Format changed TypeScript
        run: npx prettier --write src/routes/_authenticated/webhooks.tsx src/components/azwa/webhook-traffic-monitor.tsx src/lib/meta/webhook-monitor.functions.ts

      - name: ESLint changed files
        run: npx eslint src/routes/_authenticated/webhooks.tsx src/components/azwa/webhook-traffic-monitor.tsx src/lib/meta/webhook-monitor.functions.ts --fix --max-warnings=0

      - name: Full lint gate
        run: npm run lint -- --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit validated integration
        run: |
          git restore .github/workflows/webhook-monitor-build.yml || true
          if git diff --quiet; then
            echo "No generated integration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/webhooks.tsx src/components/azwa/webhook-traffic-monitor.tsx src/lib/meta/webhook-monitor.functions.ts deploy/deploy.sh
          git commit -m "feat: wire live webhook monitor and deploy guard"
          git push origin HEAD:feat/webhook-monitor-screen-20260926
