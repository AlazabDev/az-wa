name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # .env is intentionally tracked in this project.
      # It contains public VITE_* build configuration.
      # Actual secrets belong in .env.local and must never be committed.
      - name: Validate Vite environment
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f ".env" ]; then
            echo "::error::.env is missing. This project requires the tracked Vite environment file."
            exit 1
          fi

          required_vars=(
            "VITE_SUPABASE_PROJECT_ID"
            "VITE_SUPABASE_URL"
            "VITE_SUPABASE_PUBLISHABLE_KEY"
          )

          for var in "${required_vars[@]}"; do
            if ! grep -Eq "^${var}=" .env; then
              echo "::error::Missing ${var} in .env"
              exit 1
            fi
          done

          echo "Vite environment configuration found."

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Verify production build
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "dist" ]; then
            echo "::error::dist directory was not generated"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "::error::dist/index.html was not generated"
            exit 1
          fi

          echo "Production build verified successfully."
