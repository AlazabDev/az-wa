name: One-shot dependency security repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Apply in-range security fixes
        run: bun audit fix
      - name: Verify dependency audit
        run: bun audit
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package.json
          git commit -m "fix: patch vulnerable transitive dependencies"
          git push origin HEAD:main
