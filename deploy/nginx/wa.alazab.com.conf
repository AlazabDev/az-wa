# AzWA — wa.alazab.com
#
# Installed automatically by deploy/deploy.sh (symlinked into
# /etc/nginx/sites-enabled/). Do not edit the copy under
# /etc/nginx/sites-available/ directly — edit this file in the repo and
# redeploy, or your changes will be overwritten on the next deploy.
#
# Assumes certificates already exist at the standard certbot path
# (/etc/letsencrypt/live/wa.alazab.com/). If they don't yet:
#   sudo certbot certonly --nginx -d wa.alazab.com
# then re-run deploy/deploy.sh.

upstream azwa_app {
    server 127.0.0.1:8085;
    keepalive 32;
}

# ACME http-01 challenge + redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name wa.alazab.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wa.alazab.com;

    ssl_certificate     /etc/letsencrypt/live/wa.alazab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa.alazab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AzWA_SSL:10m;

    access_log /var/log/nginx/wa.alazab.com.access.log;
    error_log  /var/log/nginx/wa.alazab.com.error.log;

    # Meta sends webhook payloads with media references (not the media
    # itself), so bodies are small — but keep headroom for admin uploads
    # (e.g. bulk contact import) elsewhere in the app.
    client_max_body_size 20m;

    # --- Meta webhook: public short path -> internal TanStack route ---------
    # Meta's App Dashboard has ONLY this path registered as the callback URL.
    # Must forward the raw body byte-for-byte -- src/lib/meta/webhook.server.ts
    # recomputes the HMAC over the exact bytes Meta signed, so nothing here
    # may alter, decompress, or re-encode the request body.
    location = /webhooks/meta/whatsapp {
        proxy_pass http://azwa_app/api/public/webhooks/meta/whatsapp;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_read_timeout 30s;
    }

    # --- Everything else: app served as-is (SPA routes, /api/public/jobs/*,
    # /healthz, /readyz, authenticated routes) ------------------------------
    location / {
        proxy_pass http://azwa_app;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
    }
}
