# Host reverse proxy for wa.alazab.cloud
# Place at /etc/nginx/sites-available/wa.alazab.cloud and symlink into sites-enabled.
# TLS is issued by: certbot --nginx -d wa.alazab.cloud

server {
  listen 80;
  listen [::]:80;
  server_name wa.alazab.cloud;

  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name wa.alazab.cloud;

  ssl_certificate     /etc/letsencrypt/live/wa.alazab.cloud/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wa.alazab.cloud/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:8085;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
